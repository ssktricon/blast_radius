services:
  - name: order-api
    repository: blast-radius-demo-api
    type: producer
    contracts:
      - path: OrderCreated.cs
        kind: record
    tests:
      - command: dotnet test

  - name: order-consumer-1
    repository: blast-radius-demo-consumer-1
    type: consumer
    consumes:
      - order-api
    contracts:
      - path: OrderConsumer.cs
        kind: class
    tests:
      - command: dotnet test

  - name: order-consumer-2
    repository: blast-radius-demo-consumer-2
    type: consumer
    consumes:
      - order-api
    contracts:
      - path: OrderConsumer.cs
        kind: class
    tests:
      - command: dotnet test
